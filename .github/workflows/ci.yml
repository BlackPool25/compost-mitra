name: CI

on:
  push:
    branches:
      - main
      - feat/*
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Lint Check
        run: |
          ruff check .

      - name: Check S1 Forbidden Imports (xgboost)
        run: |
          ! grep -r "import xgboost" --include="*.py" .
          ! grep -r "from xgboost" --include="*.py" .

      - name: Run Data Contract Check (Good Datasets)
        run: |
          python scripts/datacheck.py --strict data/clean/*.csv data/ingredients.csv data/plants.csv

      - name: Verify Data Contract Check Rejection (Bad Fixtures)
        run: |
          if python scripts/datacheck.py --strict tests/fixtures/bad/*.csv; then
            echo "ERROR: Expected bad fixtures to fail validation!"
            exit 1
          else
            echo "PASS: Bad fixtures correctly rejected."
          fi

      - name: Run Unit Tests
        run: |
          python -m pytest -v

      - name: Generate and Validate CycloneDX SBOM
        run: |
          cyclonedx-py requirements -o sbom.cyclonedx.json requirements.txt
          python -c "import json; assert json.load(open('sbom.cyclonedx.json'))['bomFormat'] == 'CycloneDX'"

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Docker Image
        run: |
          docker build -t compostmitra:s1 .

      - name: Verify In-Container Data Contract Validation
        run: |
          docker run --rm compostmitra:s1 python scripts/datacheck.py --strict data/clean/hafsa_452.csv data/clean/mullick_1314.csv data/clean/zhang_848.csv data/ingredients.csv data/plants.csv
