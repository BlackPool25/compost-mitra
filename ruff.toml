target-version = "py311"
line-length = 100

[lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]
ignore = [
    "E402",  # Module level import not at top of file (common in scripts with sys.path setup)
    "F541",  # f-string without placeholders
]

[lint.per-file-ignores]
"notebooks/*" = ["F401"]
"tests/test_wording.py" = ["F401"]
