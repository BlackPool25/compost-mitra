# CompostMitra 2.0 compose — offline classroom & domestic deployment.
# Multi-stage image building React 19 PWA + FastAPI Python server on port 3000.
# Zero Streamlit overhead, cold start < 1s.
# Reproducibility: PYTHONHASHSEED=42 + SEED=42 on every service.
# Usage:
#   docker compose up app                  # default profile (React PWA + FastAPI :3000)
#   docker compose --profile gates up --abort-on-container-exit   # M1 verification gates
#   docker compose --profile offline up    # zero-network offline classroom run

services:
  app:
    build: .
    image: compostmitra:v2
    ports:
      - "3000:3000"
    environment:
      - PYTHONHASHSEED=42
      - SEED=42
      - PORT=3000
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped

  datacheck:
    image: compostmitra:v2
    profiles: ["gates"]
    environment:
      - PYTHONHASHSEED=42
      - SEED=42
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      app:
        condition: service_healthy
    command: ["python", "scripts/datacheck.py", "--strict", "data/clean/hafsa_452.csv", "data/clean/mullick_1314.csv", "data/clean/zhang_848.csv", "data/ingredients.csv", "data/plants.csv"]

  pytest:
    image: compostmitra:v2
    profiles: ["gates"]
    environment:
      - PYTHONHASHSEED=42
      - SEED=42
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      app:
        condition: service_healthy
    command: ["python", "-m", "pytest", "tests/", "-q"]

  sweep:
    image: compostmitra:v2
    profiles: ["gates"]
    environment:
      - PYTHONHASHSEED=42
      - SEED=42
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      app:
        condition: service_healthy
    command: ["sh", "-c", "mkdir -p reports && python scripts/sweep_test.py"]

  app-offline:
    build: .
    image: compostmitra:v2
    profiles: ["offline"]
    network_mode: "none"
    environment:
      - PYTHONHASHSEED=42
      - SEED=42
    mem_limit: 2g
    cpus: 2.0
    command: ["python", "scripts/datacheck.py", "--strict", "data/clean/hafsa_452.csv", "data/clean/mullick_1314.csv", "data/clean/zhang_848.csv", "data/ingredients.csv", "data/plants.csv"]
